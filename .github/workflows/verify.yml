name: verify

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --global --ignore-scripts @anthropic-ai/claude-code@2.1.329
      - name: Marketplace
        run: claude plugin validate --strict .
      - name: Plugins (directory profile)
        run: |
          for plugin in plugins/*/; do
            claude plugin validate --strict --profile directory "$plugin"
          done
      - name: No binaries outside plugin icons
        run: |
          bad=$(git ls-files | grep -vE '(^|/)\.claude-plugin/icon\.png$' | while read -r f; do
            grep -Iq . "$f" || echo "$f"; done)
          if [ -n "$bad" ]; then echo "Binary files: $bad"; exit 1; fi
